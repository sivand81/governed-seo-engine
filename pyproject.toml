[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "governed-seo-engine"
version = "0.1.0"
description = "Evidence-based, approval-gated SEO proposal engine"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Consult & Code"}]
keywords = ["seo", "governance", "structured-data", "audit"]
[project.scripts]
gseo = "governed_seo.cli:main"
[tool.setuptools.packages.find]
include = ["governed_seo*"]